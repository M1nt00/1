<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID SURVIVOR - 2D 로그라이크 슈팅</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="960" height="640"></canvas>

    <div id="hud">
      <div id="hp-bar-wrap">
        <div id="hp-bar"></div>
        <div id="hp-text">100 / 100</div>
      </div>
      <div id="xp-bar-wrap">
        <div id="xp-bar"></div>
      </div>
      <div id="top-right">
        <div id="level">LV 1</div>
        <div id="timer">00:00</div>
        <div id="kills">킬: 0</div>
        <div id="score-hud">0</div>
      </div>
    </div>

    <div id="boss-banner" class="hidden">⚠ 보스 출현! ⚠</div>
    <div id="wave-banner" class="hidden">WAVE 1</div>

    <div id="start-screen" class="overlay">
      <h1>VOID SURVIVOR</h1>
      <p class="sub">2D 로그라이크 서바이벌 슈팅 v1.5</p>
      <div class="info">
        <p><b>WASD / 방향키</b> 이동 &nbsp;·&nbsp; <b>Space / Shift</b> 대시 &nbsp;·&nbsp; 무기 자동 발사</p>
        <p>적을 처치해 경험치를 얻고 레벨업하여 무기와 능력을 강화하세요</p>
        <p>일정 시간마다 <b>보스</b>가 등장하며, 강화 엘리트 적(★)은 더 많은 보상을 드롭합니다</p>
        <p>★ 텔레포터는 순간이동으로 기습합니다. 대시로 회피하세요!</p>
      </div>
      <button id="start-btn">게임 시작</button>
    </div>

    <div id="levelup-screen" class="overlay hidden">
      <h2>레벨 업!</h2>
      <p class="sub">강화를 선택하세요</p>
      <div id="upgrade-options"></div>
    </div>

    <div id="gameover-screen" class="overlay hidden">
      <h2>게임 오버</h2>
      <p id="final-stats"></p>
      <button id="restart-btn">다시 시작</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
