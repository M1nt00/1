<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>테라 헥사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="map" aria-label="게임 지도"></canvas>

  <div id="top" hidden>
  <header id="topbar">
    <div class="chips" id="yields"></div>
    <button class="research" id="researchChip" type="button"></button>
    <div class="top-right">
      <span id="turnLabel" class="turn"></span>
      <button class="icon-btn" id="btnTech" type="button" title="연구 (T)">🔬<span>연구</span></button>
      <button class="icon-btn" id="btnPolicy" type="button" title="정책">🎭<span>정책</span></button>
      <button class="icon-btn" id="btnRel" type="button" title="종교">🙏<span>종교</span></button>
      <button class="icon-btn" id="btnDiplo" type="button" title="외교 · 승리 현황">🤝<span>외교</span></button>
      <button class="icon-btn" id="btnYield" type="button" title="타일 산출량 표시 (Y)">🔢<span>산출</span></button>
      <button class="icon-btn" id="btnHelp" type="button" title="도움말">❓<span>도움말</span></button>
      <button class="icon-btn" id="btnMenu" type="button" title="메뉴">☰<span>메뉴</span></button>
    </div>
  </header>

  <div id="banner" hidden></div>
  <aside id="advisor" hidden></aside>
  </div>
  <div id="toast" hidden></div>
  <div id="turnFlash" hidden></div>

  <div id="dock" hidden>
    <div class="dock-row">
      <div id="log"></div>
      <div class="dock-side">
        <canvas id="minimap" width="170" height="110"></canvas>
        <button id="nextBtn" type="button"></button>
      </div>
    </div>
    <div id="tileInfo" hidden></div>
    <section id="unitPanel" hidden></section>
  </div>
  <section id="cityPanel" hidden></section>

  <div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><div id="modalBody"></div></div></div>

  <div id="setup">
    <div class="setup-inner">
      <p class="eyebrow">헥스 타일 4X 전략</p>
      <h1>테라 헥사</h1>
      <p class="lede">여덟 세력 가운데 하나를 이끌어 고대부터 현대까지 문명을 키우세요. 과학·문화·종교·정복, 이기는 길은 여러 가지예요. 길잡이가 한 단계씩 알려주니 4X 전략 게임이 처음이어도 괜찮아요.</p>
      <div class="field">
        <div class="label">세력 선택</div>
        <div id="factionList" class="factions"></div>
      </div>
      <div class="field row">
        <div>
          <div class="label">상대 세력 수</div>
          <div class="seg" id="segAI"><button type="button" data-v="1">1</button><button type="button" data-v="2" class="on">2</button><button type="button" data-v="3">3</button><button type="button" data-v="4">4</button><button type="button" data-v="5">5</button></div>
        </div>
        <div>
          <div class="label">난이도</div>
          <div class="seg" id="segDiff"><button type="button" data-v="easy" class="on">입문</button><button type="button" data-v="normal">보통</button><button type="button" data-v="hard">어려움</button></div>
        </div>
        <div>
          <div class="label">게임 길이</div>
          <div class="seg" id="segLen"><button type="button" data-v="quick">빠름</button><button type="button" data-v="standard" class="on">표준</button></div>
        </div>
      </div>
      <p class="hint" id="diffHint"></p>
      <div class="setup-actions">
        <button id="btnStart" class="primary" type="button">새 게임 시작</button>
        <button id="btnContinue" class="ghost" type="button" hidden>이어서 하기</button>
      </div>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="art.js"></script>
<script src="sfx.js"></script>
<script src="ui.js"></script>
</body>
</html>
